name: Test Browser Use Cloud

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser-use
        run: pip install browser-use
        
      - name: Run login test
        env:
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
        run: |
          echo "🚀 Test avviato"
          
          browser-use config set api_key $BROWSER_USE_API_KEY
          browser-use cloud connect
          browser-use open https://www.easyhits4u.com/logon/
          sleep 5
          
          echo "📝 Inserimento email..."
          browser-use keys "Tab"
          browser-use type "sandrominori50+ulugarecexisa@gmail.com"
          sleep 1
          
          echo "📝 Inserimento password..."
          browser-use keys "Tab"
          browser-use type "DDnmVV45!!"
          sleep 1
          
          echo "🔑 Invio login..."
          browser-use keys "Enter"
          sleep 10
          
          echo ""
          echo "=== URL CORRENTE ==="
          browser-use eval 'window.location.href'
          
          echo ""
          echo "=== COOKIE ==="
          browser-use cookies get
          
          echo ""
          echo "=== FINE ==="
